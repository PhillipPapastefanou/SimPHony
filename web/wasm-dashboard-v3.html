      "SimPHony() not found — check that SimPHony_Web.js is the correct " +
      "glue file and that CMakeLists.txt still sets -sEXPORT_NAME=SimPHony."
    );
  }

  setStatus('Instantiating WASM module…');
  const Module = await SimPHony({
    locateFile: (path) => (path.endsWith('.wasm') ? WASM_PATH : path),
    print: (text) => logDebug('[stdout] ' + text),
    printErr: (text) => logError('[stderr] ' + text),
  });

  setStatus('Setting up simulation…');
  const sim = new Module.Simulation_Single_Hainich();
  sim.Init_config_web_hainich();
  sim.Init_input_web();
  const input = sim.Get_Input();

  setStatus(`Loading forcing data (${FORCING_BIN_PATH})…`);
  const { n, timestamps } = await loadForcingData(Module, input, FORCING_BIN_PATH);
  logDebug(`Loaded forcing data: n=${n}, range=[${timestamps[0]}, ${timestamps[n - 1]}]`);

  // Simulation window: 15/06 - 15/08/2023 (DD/MM), i.e. June 15 - August 15.
  // Assigned to the module-level startEpoch/endEpoch (declared above,
  // outside main()) since setupRangeSlider()/applyZoomRange() need them too.
  startEpoch = Math.floor(Date.UTC(2023, 5, 15, 0, 0, 0) / 1000);  // month is 0-indexed: 5 = June
  endEpoch = Math.floor(Date.UTC(2023, 7, 15, 0, 0, 0) / 1000);    // 7 = August

  if (startEpoch < timestamps[0] || endEpoch > timestamps[n - 1]) {
    throw new Error(
      `Simulation window [${startEpoch}, ${endEpoch}] falls outside the loaded ` +
      `forcing range [${timestamps[0]}, ${timestamps[n - 1]}].`
    );
  }

  const startIdx = timestamps.findIndex((t) => t >= startEpoch);
  logDebug(
    `Simulation window: ${new Date(startEpoch * 1000).toISOString()} to ` +
    `${new Date(endEpoch * 1000).toISOString()} (startIdx=${startIdx})`
  );

  // Baseline parameters/soil/initial water potentials — same reference
  // setup as the Flask app's run_model() (3 soil layers at 0.08/0.16/0.32 m,
  // Set_water_pot_initials(-1.0, -0.2)), applied once; sliders only touch
  // the fields listed in PARAM_CONFIGS (parameters.json) from here on.
  sim.Init_parameters_default();
  sim.Init_soil_layers_default_hainich(); // always exactly 3 soil layers
  sim.Set_water_pot_initials(-1.0, -0.2);

  // The prognostic soil hydraulic model (precipitation infiltration + Richards
  // transport + root uptake) is always on in this dashboard -- not a slider
  // choice anymore, so it's forced here once rather than living in
  // parameters.json/PARAM_CONFIGS. Every runAndRedraw() call below re-applies
  // this same baseline params object before layering the current slider
  // values on top, so it stays on across every run.
  {
    const baselineParams = sim.Get_parameters();
    baselineParams.use_prognostic_soil_hydrology = true;
    sim.Init_parameters(baselineParams);
    baselineParams.delete();
  }

  overviewChart = makeOverviewChart('chart_overview');
  // The overview always shows the full window — fixed regardless of zoom —
  // so its scale can be set once, immediately, without waiting for data.
  overviewChart.setScale('x', { min: startEpoch, max: endEpoch });
  setupRangeSlider();
  // Start zoomed into the first two weeks rather than the whole run --
  // "Reset zoom" (rs_reset click / rs_window dblclick, see
  // setupRangeSlider()) still goes to the full [startEpoch, endEpoch]
  // window, only this initial paint is narrower.
  applyZoomRange(startEpoch, Math.min(endEpoch, startEpoch + 14 * 86400));
  // One rAF of insurance in case #schematic_stage's own box wasn't fully
  // settled yet when buildOverlayCharts()/layoutOverlays() measured it
  // above, so the very first paint already matches what a resize would
  // produce.
  requestAnimationFrame(fitAll);

  // ResizeObserver on the boxes that actually drive fitAll()'s math (the
  // schematic stage sizes/positions the overlay charts; the sidebar's
  // width sizes the overview chart; the drought column's width -- via its
  // charts' CSS aspect-ratio -- sizes the drought charts) -- catches every
  // way any of them can change size, not just a window resize: the grid
  // columns reflowing, a <details> group opening/closing, fonts finishing
  // load, etc. A plain window 'resize' listener would miss all of those
  // since the window itself never changes size in those cases.
  const resizeObserver = new ResizeObserver(fitAll);
  resizeObserver.observe(document.getElementById('schematic_stage'));
  resizeObserver.observe(document.getElementById('sidebar'));
  resizeObserver.observe(document.getElementById('drought_controls'));
  // scientific_grid sizes the 4 sci charts (layoutSciCharts()); rangeslider
  // itself is observed directly since #rangeslider_block moves between two
  // different-width parents (setViewMode()) -- its own clientWidth is what
  // overviewContentWidth() actually reads, regardless of which one.
  resizeObserver.observe(document.getElementById('scientific_grid'));
  resizeObserver.observe(document.getElementById('rangeslider'));

  let rafPending = false;

  function runAndRedraw() {
    rafPending = false;
    const frameStart = performance.now();

    const paramSetStart = performance.now();
    const params = sim.Get_parameters();
    for (const cfg of PARAM_CONFIGS) {
      const raw = parseFloat(cfg.element.value);
      // Embind bool properties expect an actual JS boolean, not a Number (the
      // range input backing this control just steps between 0/1) -- coerce
      // explicitly rather than relying on JS truthy-coercion happening on
      // the C++ side.
      const value = cfg.type === 'bool' ? raw !== 0 : raw;
      cfg.valElement.textContent = formatValue(cfg, value);
      if (cfg.setter) {
        params[cfg.setter](value);
      } else {
        params[cfg.name] = value;
      }
    }
    sim.Init_parameters(params);
    params.delete(); // embind heap-allocates this on every call — free it
    const paramSetEnd = performance.now();

    const runStart = performance.now();
    sim.Run_epoch(startEpoch, endEpoch);
    const runEnd = performance.now();

    const output = sim.Get_output();
    try {
      const psiLeafView = output.Get_psi_leaf_view();
      const psiStemView = output.Get_psi_sap_view();

      const len = psiLeafView.length;
      let x;
      if (startIdx >= 0 && startIdx + len <= n) {
        x = timestamps.subarray(startIdx, startIdx + len);
      } else {
        logDebug(`warning: could not align output length ${len} to forcing timestamps (startIdx=${startIdx}), using synthetic time axis`);
        x = Float64Array.from({ length: len }, (_, i) => startEpoch + i * 1800);
      }

      const psiLeafData = psiLeafView.slice();
      const psiStemData = psiStemView.slice();

      charts.psiLeaf.setData([x, psiLeafData]);
      charts.psiStem.setData([x, psiStemData]);
      const TData = scaledVector(output.Get_T_per_ground_area(), 'T');
      const JData = scaledVector(output.Get_J_per_ground_area(), 'J');
      const GData = scaledVector(output.Get_G_per_ground_area(), 'G');
      charts.T.setData([x, TData]);
      charts.J.setData([x, JData]);
      charts.G.setData([x, GData]);
      charts.vpd.setData([x, scaledSeries(output.Get_vpd_view(), 'vpd', DROUGHT_CHART_DEFS)]);
      charts.theta.setData([x, ...thetaLayerSeries(output)]);

      // Keep these (already display-scaled) series + shared x-axis around so
      // updateFluxSums() can re-integrate over just the zoomed window without
      // touching the wasm module again -- see fluxSumSeries' declaration.
      fluxSumSeries = { x, T: TData, J: JData, G: GData };

      // Scientific-grid charts -- each slot pulls whatever variable its own
      // dropdown currently has selected via VARIABLE_DEFS.getData(), so
      // there's no per-variable branching needed here (unlike the schematic
      // block above, which is always exactly T/J/G/psiLeaf/psiStem) beyond
      // theta's getData() returning one array per soil layer (def.layers)
      // instead of a single series.
      for (let i = 0; i < sciCharts.length; i++) {
        const def = sciVariableDef(i);
        if (!sciCharts[i]) continue;
        const yData = def.getData(output);
        sciCharts[i].setData(def.layers ? [x, ...yData] : [x, yData]);
        sciFluxSumSeries[i] = def.isFlux ? { x, values: yData } : null;
      }

      overviewChart.setData([x, psiLeafData, psiStemData]);
      overviewChart.setScale('x', { min: startEpoch, max: endEpoch });
      // New data resets uPlot's own auto-range on the overlay charts — put
      // the user's current zoom (from the time-range slider) back after
      // every rerun, so tweaking a parameter slider doesn't silently zoom
      // back out. Also re-integrates the Σ badges for the new data (see
      // applyZoomRange()'s call to updateFluxSums()).
      applyZoomRange(selMin, selMax);
    } finally {
      output.delete();
    }
    const drawEnd = performance.now();

    const paramSetMs = (paramSetEnd - paramSetStart).toFixed(1);
    const runMs = (runEnd - runStart).toFixed(1);
    const readDrawMs = (drawEnd - runEnd).toFixed(1);
    const totalMs = (drawEnd - frameStart).toFixed(1);
    logDebug(`[perf] params=${paramSetMs}ms Run_epoch=${runMs}ms readOutput+draw=${readDrawMs}ms total=${totalMs}ms`);

    setStatus(`Ready (${totalMs}ms)`);
  }

  function scheduleRun() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(runAndRedraw);
  }

  for (const cfg of PARAM_CONFIGS) {
    cfg.element.addEventListener('input', scheduleRun);
  }

  // Wired here rather than in buildSciChartBlock() (a top-level, pre-main()
  // function) since rebuildSciChart()/scheduleRun() -- scheduleRun in
  // particular -- only exist once main() has run this far; see
  // buildSciChartBlock()'s own comment on sciSelectEls[].
  for (let i = 0; i < sciSelectEls.length; i++) {
    sciSelectEls[i].addEventListener('change', () => {
      sciSelectedKeys[i] = sciSelectEls[i].value;
      rebuildSciChart(i);
      scheduleRun();
    });
  }

  scheduleRun();
}

main().catch(err => {
  setStatus('Error — see debug output below', true);
  logError(String(err && err.stack ? err.stack : err));
});
</script>
</body>
</html>
