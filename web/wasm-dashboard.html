<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plant Hydraulics — Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  #status { font-size: 0.85rem; color: #666; margin-bottom: 16px; }
  #status.error { color: #b00020; }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    align-items: start;
  }

  .sidebar {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    position: sticky;
    top: 16px;
  }
  .sidebar h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin: 20px 0 10px;
  }
  .sidebar h2:first-child { margin-top: 0; }

  .control { margin-bottom: 14px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .control label span.val { font-weight: 400; color: #555; }
  .control input[type=range] { width: 100%; }

  .main { min-width: 0; }

  /* 2x2 grid mirroring the Flask app's make_subplots layout:
     row 1 spans both columns (Leaf + Stem water potential, combined),
     row 2 splits into VPD (left) and stomatal conductance (right). */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .grid .span2 { grid-column: 1 / -1; }
  .chart-block h2 { font-size: 0.95rem; margin: 0 0 6px 2px; color: #333; }
  .chart-block .hint { font-size: 0.72rem; color: #999; margin: 0 0 6px 2px; }

  /* Range slider: a fixed-domain overview chart with a draggable/resizable
     window overlay, standing in for Plotly's xaxis rangeslider. Dragging it
     only calls uPlot's setScale() on the three synced charts above — no
     simulation re-run — so it stays smooth regardless of drag rate. */
  .rangeslider-block { margin-top: 8px; }
  .rangeslider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0 0 6px 2px;
  }
  .rangeslider-header h2 { margin: 0; }
  #rs_reset {
    font-size: 0.75rem;
    padding: 3px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }
  #rs_reset:hover { background: #f2f2f2; }

  .rangeslider { position: relative; }
  .rs-window {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(37, 99, 235, 0.15);
    border: 1px solid rgba(37, 99, 235, 0.65);
    cursor: grab;
    touch-action: none;
  }
  .rs-window:active { cursor: grabbing; }
  .rs-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 9px;
    cursor: ew-resize;
    background: rgba(37, 99, 235, 0.65);
    touch-action: none;
  }
  .rs-handle-left { left: -5px; }
  .rs-handle-right { right: -5px; }

  #debug {
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 0.75rem;
    background: #f6f6f6;
    border-radius: 6px;
    padding: 8px 10px;
    display: none;
    margin-top: 16px;
  }
  #debug.show { display: block; }
</style>
</head>
<body>

<h1>Plant Hydraulics — Dashboard</h1>
<div id="status">Loading WASM module…</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <!-- slider controls are generated into here by SLIDER_CONFIGS below -->
  </div>

  <div class="main">
    <div class="grid">
      <div class="chart-block span2">
        <h2>Water potential — Leaf &amp; Stem</h2>
        <div id="chart_psi"></div>
      </div>
      <div class="chart-block">
        <h2>VPD</h2>
        <div id="chart_vpd"></div>
      </div>
      <div class="chart-block">
        <h2>Stomatal closure (β)</h2>
        <div id="chart_beta"></div>
      </div>
    </div>

    <div class="chart-block rangeslider-block">
      <div class="rangeslider-header">
        <h2>Time range</h2>
        <button id="rs_reset" type="button">Reset zoom</button>
      </div>
      <div class="rangeslider" id="rangeslider">
        <div id="chart_overview"></div>
        <div class="rs-window" id="rs_window">
          <div class="rs-handle rs-handle-left" data-handle="left"></div>
          <div class="rs-handle rs-handle-right" data-handle="right"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<pre id="debug"></pre>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>

<!--
  =====================================================================
  PATH #1 — the Emscripten JS glue file. See wasm-example.html for the
  full explanation; unchanged here. Matches build_web/SimPHony_Web.js.
  =====================================================================
-->
<script src="../build_web/SimPHony_Web.js"></script>

<script>
"use strict";

// =======================================================================
// PATH #2 / #3 — same convention as wasm-example.html.
// =======================================================================
const WASM_PATH = '../build_web/SimPHony_Web.wasm';
const FORCING_BIN_PATH = '../forcing.bin';

// =======================================================================
// Sliders — the same four knobs as the Flask reference app's
// update_plot() route (slider1..slider4), including its unit
// conversions, applied in runAndRedraw() below:
//
//   params.k_xylem_sat               = k_xylem * 1000 / 18
//   params.stem_hydraulic_capacitance_max = gamma_stem * 1000 / 18
//   params.psi_leaf_50_close         = psi_leaf_50_close   (direct)
//   params.leaf_hydraulic_capacitance = gamma_leaf / 1000 * 1000 / 18
//
// The Flask app's single `stem_hydraulic_capacitance` field predates
// this model's split into _max/_res (see wasm-example.html); gamma_stem
// maps onto stem_hydraulic_capacitance_max here, and _res is left at
// its Init_parameters_default() value untouched by this simpler UI.
//
// Slider ranges/defaults are the *raw* (pre-conversion) values, chosen
// so the converted result lands in the same physically-reasonable band
// used by wasm-example.html's own sliders for these fields.
// =======================================================================
const SLIDER_CONFIGS = [
  {
    group: 'Xylem',
    key: 'k_xylem', label: 'Xylem sat. conductivity (k_xylem)',
    min: 0.2, max: 8, step: 0.1, default: 2.0,
    format: (v) => v.toFixed(2),
    apply: (params, v) => { params.k_xylem_sat = v * 1000 / 18; },
  },
  {
    group: 'Capacitance',
    key: 'gamma_stem', label: 'Stem capacitance (gamma_stem)',
    min: 10, max: 500, step: 5, default: 220.0,
    format: (v) => v.toFixed(0),
    apply: (params, v) => { params.stem_hydraulic_capacitance_max = v * 1000 / 18; },
  },
  {
    group: 'Capacitance',
    key: 'gamma_leaf', label: 'Leaf capacitance (gamma_leaf)',
    min: 2, max: 50, step: 0.5, default: 15.0,
    format: (v) => v.toFixed(1),
    apply: (params, v) => { params.leaf_hydraulic_capacitance = (v / 1000) * 1000 / 18; },
  },
  {
    group: 'Stomatal',
    key: 'psi_leaf_50_close', label: 'Leaf ψ₅₀ closure (MPa)',
    min: -4, max: -0.2, step: 0.05, default: -1.5,
    format: (v) => v.toFixed(2),
    apply: (params, v) => { params.psi_leaf_50_close = v; },
  },
];

const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isError);
}

function logDebug(msg) {
  debugEl.classList.add('show');
  debugEl.textContent += msg + "\n";
  console.log(msg);
}

// ---------------------------------------------------------------------
// Build the sidebar sliders from SLIDER_CONFIGS, grouped under headings.
// ---------------------------------------------------------------------
function buildSliders() {
  const sidebar = document.getElementById('sidebar');
  let lastGroup = null;

  for (const cfg of SLIDER_CONFIGS) {
    if (cfg.group !== lastGroup) {
      const h = document.createElement('h2');
      h.textContent = cfg.group;
      sidebar.appendChild(h);
      lastGroup = cfg.group;
    }

    const wrap = document.createElement('div');
    wrap.className = 'control';

    const label = document.createElement('label');
    label.htmlFor = cfg.key;
    const valSpan = document.createElement('span');
    valSpan.className = 'val';
    valSpan.id = cfg.key + '_val';
    valSpan.textContent = cfg.format(cfg.default);
    label.append(cfg.label + ' ', valSpan);

    const input = document.createElement('input');
    input.type = 'range';
    input.id = cfg.key;
    input.min = cfg.min;
    input.max = cfg.max;
    input.step = cfg.step;
    input.value = cfg.default;

    wrap.append(label, input);
    sidebar.appendChild(wrap);

    cfg.element = input;
    cfg.valElement = valSpan;
  }
}

// ---------------------------------------------------------------------
// FRC2 binary forcing loader — identical to wasm-example.html.
// ---------------------------------------------------------------------
const FRC_MAGIC = 'FRC2';
const HEADER_BYTES = 16;

async function loadForcingData(Module, input, url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`failed to fetch ${url}: ${res.status} ${res.statusText}`);
  const buf = await res.arrayBuffer();
  const dv = new DataView(buf);

  const magic = new TextDecoder().decode(new Uint8Array(buf, 0, 4));
  if (magic !== FRC_MAGIC) throw new Error(`bad forcing binary magic "${magic}", expected "${FRC_MAGIC}"`);

  const n = dv.getInt32(4, true);
  const nLayers = dv.getInt32(8, true);
  const bodyBytes = buf.byteLength - HEADER_BYTES;
  const expectedBytes = n * 4 + n * 4 + n * 4 + n * 4 + n * nLayers * 4;
  if (bodyBytes !== expectedBytes) {
    throw new Error(`forcing binary size mismatch: got ${bodyBytes} bytes, expected ${expectedBytes} for n=${n}, nLayers=${nLayers}`);
  }

  const ptr = Module._malloc(bodyBytes);
  try {
    Module.HEAPU8.set(new Uint8Array(buf, HEADER_BYTES), ptr);
    input.Set_Forcing_Data_Blob(ptr, n, nLayers);
  } finally {
    Module._free(ptr);
  }

  const timestamps = new Int32Array(buf.slice(HEADER_BYTES, HEADER_BYTES + n * 4));

  return { n, nLayers, timestamps };
}

// ---------------------------------------------------------------------
// uPlot setup.
// ---------------------------------------------------------------------
// Drag-to-zoom is disabled on all three synced charts (cursor.drag.x:false)
// since the range slider below is the single, shared zoom control — see
// setupRangeSlider(). Hover crosshair/legend stay on.
function makeDualChart(containerId) {
  const opts = {
    width: document.querySelector('.main').clientWidth,
    height: 320,
    scales: { x: { time: true } },
    cursor: { drag: { x: false, y: false } },
    series: [
      {},
      { label: 'Leaf', stroke: '#16a34a', width: 1.5 },
      { label: 'Stem', stroke: '#ea580c', width: 1.5 },
    ],
    axes: [{}, { label: 'Water potential (MPa)' }],
  };
  return new uPlot(opts, [[], [], []], document.getElementById(containerId));
}

function makeChart(containerId, seriesLabel, color, yLabel) {
  const opts = {
    width: (document.querySelector('.main').clientWidth - 20) / 2,
    height: 260,
    scales: { x: { time: true } },
    cursor: { drag: { x: false, y: false } },
    series: [
      {},
      { label: seriesLabel, stroke: color, width: 1.5 },
    ],
    axes: [{}, { label: yLabel }],
  };
  return new uPlot(opts, [[], []], document.getElementById(containerId));
}

// ---------------------------------------------------------------------
// Range slider — a fixed-domain overview chart (always shows the full
// [startEpoch, endEpoch] window) with a draggable/resizable selection
// overlay. Dragging it only calls setScale('x', ...) on the three synced
// charts above; it never touches the simulation, so it's cheap regardless
// of drag rate. Modeled on the Flask/Plotly app's xaxis rangeslider.
// ---------------------------------------------------------------------
let selMin, selMax; // current zoom window, epoch seconds
let startEpoch, endEpoch; // full simulation window, set once in main()
let overviewChart, rsWindowEl, rsHandleLeftEl, rsHandleRightEl;
let charts; // { psi, vpd, beta } — set once in main(), read by applyZoomRange()

function makeOverviewChart(containerId) {
  const opts = {
    width: document.querySelector('.main').clientWidth,
    height: 70,
    scales: { x: { time: true } },
    cursor: { show: false, drag: { x: false, y: false } },
    legend: { show: false },
    series: [
      {},
      { stroke: '#16a34a', width: 1 },
      { stroke: '#ea580c', width: 1 },
    ],
    axes: [{ size: 24 }, { show: false }],
  };
  const u = new uPlot(opts, [[], [], []], document.getElementById(containerId));
  // uPlot clips its plotting layer by default (for the drag-select box we're
  // not using here) — undo that so the handles can stick out a few px.
  u.over.style.overflow = 'visible';
  return u;
}

function updateRangeSliderVisual() {
  const left = overviewChart.valToPos(selMin, 'x');
  const right = overviewChart.valToPos(selMax, 'x');
  rsWindowEl.style.left = `${left}px`;
  rsWindowEl.style.width = `${Math.max(right - left, 6)}px`;
}

// Sets the shared zoom window on the three main charts and moves the
// overlay to match. Called both from user drags and after each simulation
// re-run (to re-assert whatever zoom the user already had).
function applyZoomRange(min, max) {
  selMin = Math.max(startEpoch, Math.min(min, max));
  selMax = Math.min(endEpoch, Math.max(min, max));
  charts.psi.setScale('x', { min: selMin, max: selMax });
  charts.vpd.setScale('x', { min: selMin, max: selMax });
  charts.beta.setScale('x', { min: selMin, max: selMax });
  updateRangeSliderVisual();
}

function setupRangeSlider() {
  rsWindowEl = document.getElementById('rs_window');
  rsHandleLeftEl = rsWindowEl.querySelector('.rs-handle-left');
  rsHandleRightEl = rsWindowEl.querySelector('.rs-handle-right');

  function overPxToVal(clientX) {
    const rect = overviewChart.over.getBoundingClientRect();
    const px = Math.max(0, Math.min(clientX - rect.left, rect.width));
    return overviewChart.posToVal(px, 'x');
  }

  function beginDrag(mode, downEvt) {
    downEvt.preventDefault();
    const startVal = overPxToVal(downEvt.clientX);
    const initialMin = selMin;
    const initialMax = selMax;

    function onMove(moveEvt) {
      const val = overPxToVal(moveEvt.clientX);
      if (mode === 'left') {
        applyZoomRange(Math.min(val, initialMax - 1), initialMax);
      } else if (mode === 'right') {
        applyZoomRange(initialMin, Math.max(val, initialMin + 1));
      } else {
        const delta = val - startVal;
        const width = initialMax - initialMin;
        let newMin = initialMin + delta;
        let newMax = initialMax + delta;
        if (newMin < startEpoch) { newMin = startEpoch; newMax = startEpoch + width; }
        if (newMax > endEpoch) { newMax = endEpoch; newMin = endEpoch - width; }
        applyZoomRange(newMin, newMax);
      }
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  rsWindowEl.addEventListener('pointerdown', (e) => {
    if (e.target === rsHandleLeftEl || e.target === rsHandleRightEl) return;
    beginDrag('pan', e);
  });
  rsHandleLeftEl.addEventListener('pointerdown', (e) => beginDrag('left', e));
  rsHandleRightEl.addEventListener('pointerdown', (e) => beginDrag('right', e));
  rsWindowEl.addEventListener('dblclick', () => applyZoomRange(startEpoch, endEpoch));

  document.getElementById('rs_reset').addEventListener('click', () => applyZoomRange(startEpoch, endEpoch));
}

// ---------------------------------------------------------------------
// Main
// ---------------------------------------------------------------------
async function main() {
  buildSliders();

  if (typeof SimPHony !== 'function') {
    throw new Error(
      "SimPHony() not found — check that SimPHony_Web.js is the correct " +
      "glue file and that CMakeLists.txt still sets -sEXPORT_NAME=SimPHony."
    );
  }

  setStatus('Instantiating WASM module…');
  const Module = await SimPHony({
    locateFile: (path) => (path.endsWith('.wasm') ? WASM_PATH : path),
    print: (text) => logDebug('[stdout] ' + text),
    printErr: (text) => logDebug('[stderr] ' + text),
  });

  setStatus('Setting up simulation…');
  const sim = new Module.Simulation_Single_Hainich();
  sim.Init_config_web_hainich();
  sim.Init_input_web();
  const input = sim.Get_Input();

  setStatus(`Loading forcing data (${FORCING_BIN_PATH})…`);
  const { n, timestamps } = await loadForcingData(Module, input, FORCING_BIN_PATH);
  logDebug(`Loaded forcing data: n=${n}, range=[${timestamps[0]}, ${timestamps[n - 1]}]`);

  // Simulation window, taken directly from the Flask reference app
  // (date_start_str = "2023-06-25 00:00:00", date_end_str = "2023-08-29 00:00:00").
  // Assigned to the module-level startEpoch/endEpoch (declared above,
  // outside main()) since setupRangeSlider()/applyZoomRange() need them too.
  startEpoch = Math.floor(Date.UTC(2023, 5, 25, 0, 0, 0) / 1000);  // month is 0-indexed: 5 = June
  endEpoch = Math.floor(Date.UTC(2023, 7, 29, 0, 0, 0) / 1000);    // 7 = August

  if (startEpoch < timestamps[0] || endEpoch > timestamps[n - 1]) {
    throw new Error(
      `Simulation window [${startEpoch}, ${endEpoch}] falls outside the loaded ` +
      `forcing range [${timestamps[0]}, ${timestamps[n - 1]}].`
    );
  }

  const startIdx = timestamps.findIndex((t) => t >= startEpoch);
  logDebug(
    `Simulation window: ${new Date(startEpoch * 1000).toISOString()} to ` +
    `${new Date(endEpoch * 1000).toISOString()} (startIdx=${startIdx})`
  );

  // Baseline parameters/soil/initial water potentials — same reference
  // setup as the Flask app's run_model() (3 soil layers at 0.08/0.16/0.32 m,
  // Set_water_pot_initials(-1.0, -0.2)), applied once; sliders only touch
  // the four fields in SLIDER_CONFIGS from here on.
  sim.Init_parameters_default();
  sim.Init_soil_layers_default_hainich();
  sim.Set_water_pot_initials(-1.0, -0.2);

  charts = {
    psi: makeDualChart('chart_psi'),
    vpd: makeChart('chart_vpd', 'VPD', '#2563eb', 'VPD [Pa]'),
    beta: makeChart('chart_beta', 'β', '#000000', 'Stomatal closure β [-]'),
  };

  overviewChart = makeOverviewChart('chart_overview');
  // The overview always shows the full window — fixed regardless of zoom —
  // so its scale can be set once, immediately, without waiting for data.
  overviewChart.setScale('x', { min: startEpoch, max: endEpoch });
  setupRangeSlider();
  applyZoomRange(startEpoch, endEpoch); // start fully zoomed out

  window.addEventListener('resize', () => {
    const wFull = document.querySelector('.main').clientWidth;
    charts.psi.setSize({ width: wFull, height: 320 });
    const wHalf = (wFull - 20) / 2;
    charts.vpd.setSize({ width: wHalf, height: 260 });
    charts.beta.setSize({ width: wHalf, height: 260 });
    overviewChart.setSize({ width: wFull, height: 70 });
    updateRangeSliderVisual();
  });

  let rafPending = false;

  function runAndRedraw() {
    rafPending = false;
    const frameStart = performance.now();

    const paramSetStart = performance.now();
    const params = sim.Get_parameters();
    for (const cfg of SLIDER_CONFIGS) {
      const value = parseFloat(cfg.element.value);
      cfg.valElement.textContent = cfg.format(value);
      cfg.apply(params, value);
    }
    sim.Init_parameters(params);
    params.delete(); // embind heap-allocates this on every call — free it
    const paramSetEnd = performance.now();

    const runStart = performance.now();
    sim.Run_epoch(startEpoch, endEpoch);
    const runEnd = performance.now();

    const output = sim.Get_output();
    try {
      const psiLeafView = output.Get_psi_leaf_view();
      const psiStemView = output.Get_psi_sap_view();
      const vpdView = output.Get_vpd_view();
      const betaView = output.Get_beta_view();

      const len = psiLeafView.length;
      let x;
      if (startIdx >= 0 && startIdx + len <= n) {
        x = timestamps.subarray(startIdx, startIdx + len);
      } else {
        logDebug(`warning: could not align output length ${len} to forcing timestamps (startIdx=${startIdx}), using synthetic time axis`);
        x = Float64Array.from({ length: len }, (_, i) => startEpoch + i * 1800);
      }

      const psiLeafData = psiLeafView.slice();
      const psiStemData = psiStemView.slice();
      charts.psi.setData([x, psiLeafData, psiStemData]);
      charts.vpd.setData([x, vpdView.slice()]);
      charts.beta.setData([x, betaView.slice()]);

      overviewChart.setData([x, psiLeafData, psiStemData]);
      overviewChart.setScale('x', { min: startEpoch, max: endEpoch });
      // New data resets uPlot's own auto-range on the main charts — put the
      // user's current zoom (from the range slider) back after every rerun,
      // so tweaking a parameter slider doesn't silently zoom back out.
      applyZoomRange(selMin, selMax);
    } finally {
      output.delete();
    }
    const drawEnd = performance.now();

    const paramSetMs = (paramSetEnd - paramSetStart).toFixed(1);
    const runMs = (runEnd - runStart).toFixed(1);
    const readDrawMs = (drawEnd - runEnd).toFixed(1);
    const totalMs = (drawEnd - frameStart).toFixed(1);
    logDebug(`[perf] params=${paramSetMs}ms Run_epoch=${runMs}ms readOutput+draw=${readDrawMs}ms total=${totalMs}ms`);

    setStatus(`Ready (${totalMs}ms)`);
  }

  function scheduleRun() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(runAndRedraw);
  }

  for (const cfg of SLIDER_CONFIGS) {
    cfg.element.addEventListener('input', scheduleRun);
  }

  scheduleRun();
}

main().catch(err => {
  setStatus('Error — see debug output below', true);
  logDebug(String(err && err.stack ? err.stack : err));
  console.error(err);
});
</script>
</body>
</html>
